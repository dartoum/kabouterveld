<!doctype html> <!--local-->
<html lang="nl"> <!--local-->
<head> <!--local-->
<meta charset="utf-8"> <!--local-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <!--local-->
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style> <!--local-->
<title>Kabouterveld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: één kolom tijdlijn op de telefoon (tijd | kaart), stations 2 breed vanaf 640px. Schetsen zijn mini-veldjes met maaistroken. */
:root {
  --bg: #EEF2E9;
  --surface: #FFFFFF;
  --surface-2: #E2E9DB;
  --fg: #142019;
  --muted: #4F5F55;
  --line: #CCD7C5;
  --primary: #1B6536;
  --on-primary: #FFFFFF;
  --cone: #E05A17;
  --cone-y: #F2C21B;
  --cone-b: #2F6FD6;
  --cone-r: #D23A3A;
  --vest: #D6EF2F;
  --kid-b: #3A73D8;
  --parent: #121820;
  --field: #3D8A4E;
  --field-mow: #46955A;
  --chalk: #FFFFFF;
  --net: rgba(255, 255, 255, .28);
  --water: #5BA6D4;
  --ink-on-field: #0E1A12;
  --focus: #E05A17;
  --shadow: 0 1px 2px rgba(20, 32, 25, .06), 0 6px 18px rgba(20, 32, 25, .06);
  /* Timer: altijd het avondveld, bewust één look */
  --t-bg: #0E1A12;
  --t-surface: #17271C;
  --t-fg: #F1F6EE;
  --t-muted: #9FB4A5;
  --t-accent: #D6EF2F;
  --t-warn: #FF8A3D;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1410;
    --surface: #152019;
    --surface-2: #1D2B22;
    --fg: #E6EFE3;
    --muted: #9EB1A3;
    --line: #2A3A30;
    --primary: #6DCB88;
    --on-primary: #0A1A0F;
    --field: #2B6339;
    --field-mow: #316C40;
    --focus: #FF8A3D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1410;
  --surface: #152019;
  --surface-2: #1D2B22;
  --fg: #E6EFE3;
  --muted: #9EB1A3;
  --line: #2A3A30;
  --primary: #6DCB88;
  --on-primary: #0A1A0F;
  --field: #2B6339;
  --field-mow: #316C40;
  --focus: #FF8A3D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1080px; margin-inline: auto; padding-inline: 16px; }
.eyebrow {
  font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 900; font-stretch: 112%; font-size: 20px; letter-spacing: -.01em; }
.brand svg { width: 22px; height: 22px; flex: none; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.tab {
  border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--muted); min-height: 38px;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
@media (max-width: 520px) {
  .tabs { width: 100%; }
  .tab { flex: 1; padding-inline: 6px; }
}

main { padding-block: 24px 64px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 16px; border-radius: 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
  font-family: var(--font-display); font-weight: 700; font-size: 15px; text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.08); }
.btn svg, .mini svg, .icon-btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; flex: none;
  border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
}
.mini {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 10px;
  border: 0; border-radius: 10px; background: var(--surface-2); cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--fg);
}
.mini:hover { filter: brightness(.97); }
.mini[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.mini:disabled { opacity: .45; cursor: not-allowed; }

/* Intro */
.intro { display: grid; gap: 16px; margin-bottom: 28px; }
.intro h1 { font-size: clamp(30px, 7vw, 46px); font-weight: 900; font-stretch: 108%; letter-spacing: -.02em; margin-top: 4px; }
.lede { color: var(--muted); max-width: 58ch; margin-top: 8px; }
.intro-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.start-field {
  display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 4px 6px 4px 14px;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface);
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
}
.start-field input {
  font: inherit; font-variant-numeric: tabular-nums; border: 0; background: var(--surface-2); color: var(--fg);
  border-radius: 8px; padding: 6px 8px; min-height: 36px;
}
@media (min-width: 860px) {
  .intro { grid-template-columns: 1fr auto; align-items: end; }
}

/* Tijdlijn */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 22px; }
.tl::before { content: ""; position: absolute; left: 27px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl-time { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 800; font-size: 17px; padding-top: 2px; }
.tl-time small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
.tl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 10px; }
.tl-head h2 { font-size: 20px; font-weight: 800; }
.tl-head .meta { color: var(--muted); font-size: 14px; }
.note { color: var(--muted); font-size: 15px; max-width: 62ch; }
.plain-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }

/* Slot-kaart */
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.slot.locked { border-color: var(--fg); }
.slot-main {
  display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 14px; align-items: center; width: 100%; min-width: 0;
  text-align: left; background: none; border: 0; padding: 12px; cursor: pointer; border-radius: var(--r) var(--r) 0 0;
}
.slot-main:hover .slot-name { text-decoration: underline; text-underline-offset: 3px; }
.slot-sketch svg { display: block; width: 100%; height: auto; }
.slot-text { display: grid; gap: 3px; min-width: 0; }
.slot-label { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.slot-name { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.15; }
.slot-story { color: var(--muted); font-size: 14.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slot-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 12px 12px; }
.slot-actions .mini { min-width: 0; }
@media (max-width: 520px) {
  .slot-main { grid-template-columns: 84px minmax(0, 1fr); gap: 12px; }
  .slot-actions .mini { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 12.5px; min-height: 50px; }
  .tl { grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
  .tl::before { left: 22px; }
  .tl-time { font-size: 15px; }
}
.stations { display: grid; gap: 12px; }
@media (min-width: 640px) { .stations { grid-template-columns: 1fr 1fr; } }

/* Carrousel-tabel */
.rot-wrap { overflow-x: auto; margin-top: 14px; }
.rot { border-collapse: separate; border-spacing: 3px; font-family: var(--font-display); width: 100%; }
.rot th, .rot td { padding: 6px 4px; text-align: center; border-radius: 8px; font-variant-numeric: tabular-nums; }
.rot thead th { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.rot thead th small { display: block; font-weight: 600; }
.rot tbody th { text-align: left; font-size: 14px; font-weight: 700; white-space: nowrap; }
.rot td { background: var(--surface-2); font-weight: 800; font-size: 16px; }
.rot td.l0 { background: color-mix(in srgb, var(--vest) 55%, var(--surface)); color: #1A2406; }
.rot td.l1 { background: color-mix(in srgb, var(--cone) 30%, var(--surface)); }
.rot td.l2 { background: color-mix(in srgb, var(--kid-b) 28%, var(--surface)); }
.rot td.l3 { background: color-mix(in srgb, var(--primary) 26%, var(--surface)); }

.share-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; padding-top: 22px; border-top: 1px solid var(--line); }

/* Schets */
.sk { display: block; width: 100%; height: auto; max-width: 100%; }
.sk-field { fill: var(--field); }
.sk-mow { fill: var(--field-mow); }
.sk-zone { fill: rgba(255, 255, 255, .07); stroke: var(--chalk); stroke-width: 1; stroke-dasharray: 4 3; opacity: .85; }
.sk-water { fill: var(--water); opacity: .55; }
.sk-line { stroke: var(--chalk); stroke-width: 1.4; opacity: .9; }
.sk-cone { fill: var(--cone); stroke: var(--ink-on-field); stroke-width: .5; }
.sk-cone.y { fill: var(--cone-y); }
.sk-cone.b { fill: var(--cone-b); }
.sk-cone.r { fill: var(--cone-r); }
.sk-goal { fill: var(--net); stroke: var(--chalk); stroke-width: 1.1; }
.sk-post { stroke: var(--chalk); stroke-width: 2.2; stroke-linecap: round; }
.sk-kid { stroke: var(--ink-on-field); stroke-width: 1; fill: var(--vest); }
.sk-kid.t1 { fill: var(--kid-b); stroke: var(--chalk); }
.sk-parent { fill: var(--parent); stroke: var(--chalk); stroke-width: 1.4; }
.sk-ball { fill: #FFFFFF; stroke: var(--ink-on-field); stroke-width: .8; }
.sk-run { fill: none; stroke: var(--chalk); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#kv-arrow); }
.sk-pass { fill: none; stroke: var(--chalk); stroke-width: 1.3; stroke-dasharray: 3 2.5; stroke-linecap: round; marker-end: url(#kv-arrow); }
.sk-arrowhead { fill: var(--chalk); }
.sk-txt { fill: var(--chalk); font-family: var(--font-display); font-size: 7.5px; font-weight: 700; text-anchor: middle; letter-spacing: .02em; }
.sk-txt.l { text-anchor: start; font-size: 6.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .9; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 18px; height: 12px; }

/* Catalogus */
.cat-head { display: grid; gap: 12px; margin-bottom: 18px; }
.cat-head h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 900; font-stretch: 108%; letter-spacing: -.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface);
  font-family: var(--font-display); font-weight: 700; font-size: 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .65; margin-left: 4px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.card-open { display: grid; grid-template-rows: auto 1fr; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.card-open svg.sk { border-radius: 0; }
.card-body { padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; }
.card-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.card h3 { font-size: 18px; font-weight: 800; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); font-family: var(--font-display); font-weight: 600; }
.card .story-line { color: var(--muted); font-size: 14px; line-height: 1.4; }
.card-wrap { position: relative; }
.fav-btn {
  position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 999px; border: 0; cursor: pointer;
  display: grid; place-items: center; background: rgba(14, 26, 18, .55); color: #FFFFFF;
}
.fav-btn svg { width: 20px; height: 20px; }
.fav-btn[aria-pressed="true"] { color: #FF6B6B; background: rgba(255, 255, 255, .92); }
.empty { padding: 28px; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--muted); text-align: center; }

/* Bewaard */
.saved-grid { display: grid; gap: 22px; }
@media (min-width: 860px) { .saved-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 360px); align-items: start; } }
.saved-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.saved-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.saved-item h3 { font-size: 17px; font-weight: 800; }
.saved-item .games { color: var(--muted); font-size: 14px; }
.saved-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.code-form { display: grid; gap: 10px; }
.code-form textarea {
  font: 15px/1.4 var(--font-body); width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
}
.form-msg { font-size: 14px; color: var(--cone-r); min-height: 1.4em; }
.form-msg.ok { color: var(--primary); }

/* Dialoog */
dialog {
  border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--fg);
  width: min(680px, calc(100vw - 24px)); max-height: min(90vh, 900px); box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
}
dialog::backdrop { background: rgba(8, 14, 10, .55); }
.dlg { padding: 18px 18px 22px; display: grid; gap: 14px; }
.dlg-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.dlg-head h2 { font-size: 26px; font-weight: 900; font-stretch: 105%; margin-top: 2px; }
.dlg h3 { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.dlg ol, .dlg ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.facts { list-style: none; padding: 0 !important; display: grid !important; grid-template-columns: auto 1fr; gap: 6px 14px !important; }
.facts li { display: contents; }
.facts dt, .facts .k { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 14px; }
.story {
  margin: 0; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--vest) 30%, var(--surface));
  font-size: 17px; line-height: 1.45; font-style: italic;
}
.vary { display: grid; gap: 10px; }
@media (min-width: 520px) { .vary { grid-template-columns: 1fr 1fr; } }
.vary > div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.vary h4 { font-size: 14px; font-weight: 800; margin-bottom: 2px; }
.tip { border-left: 3px solid var(--cone); padding-left: 12px; }
.tip strong { font-family: var(--font-display); }
.dlg-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 6px; border-top: 1px solid var(--line); }
.dlg-actions .lbl { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--muted); width: 100%; }
.pick-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pick-item {
  width: 100%; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left;
  padding: 8px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
}
.pick-item[aria-current="true"] { border-color: var(--fg); }
.pick-item strong { font-family: var(--font-display); font-size: 16px; display: block; }
.pick-item span { color: var(--muted); font-size: 13.5px; }
.copy-area { width: 100%; min-height: 260px; font: 14px/1.45 var(--font-body); padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--fg); }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-family: var(--font-display); font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Timer */
.timer {
  position: fixed; inset: 0; z-index: 40; background: var(--t-bg); color: var(--t-fg);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); color-scheme: dark;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px));
}
.timer .icon-btn { background: var(--t-surface); border-color: #2C4434; color: var(--t-fg); }
.t-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 760px; width: 100%; margin-inline: auto; }
.t-step { font-family: var(--font-display); font-weight: 700; color: var(--t-muted); font-size: 14px; letter-spacing: .04em; }
.t-main { overflow-y: auto; max-width: 760px; width: 100%; margin-inline: auto; padding-block: 12px; display: grid; align-content: start; gap: 12px; }
.t-kicker { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--t-accent); font-size: 14px; }
.t-title { font-family: var(--font-display); font-weight: 900; font-stretch: 105%; font-size: clamp(26px, 7vw, 44px); line-height: 1.05; }
.t-clock {
  font-family: var(--font-display); font-weight: 800; font-stretch: 72%; font-variant-numeric: tabular-nums;
  font-size: clamp(88px, 30vw, 220px); line-height: .9; letter-spacing: -.02em;
}
.t-clock.warn { color: var(--t-warn); }
.t-clock.paused { opacity: .5; }
.t-bar { height: 8px; border-radius: 99px; background: var(--t-surface); overflow: hidden; }
.t-bar i { display: block; height: 100%; background: var(--t-accent); width: 0; }
.t-story { font-size: 18px; line-height: 1.45; color: var(--t-fg); font-style: italic; }
.t-groups { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.t-groups li { display: grid; grid-template-columns: 82px 34px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--t-surface); border-radius: 10px; padding: 8px 10px; }
.t-groups b { font-family: var(--font-display); }
.t-groups .letter { font-family: var(--font-display); font-weight: 900; font-size: 20px; color: var(--t-accent); text-align: center; }
.t-next { color: var(--t-muted); font-size: 15px; }
.t-controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 8px; max-width: 760px; width: 100%; margin-inline: auto; }
.t-controls .btn { background: var(--t-surface); color: var(--t-fg); border-color: #2C4434; min-height: 58px; padding-inline: 8px; gap: 6px; }
.t-controls .btn:disabled { opacity: .4; }
.t-controls .btn.go { background: var(--t-accent); color: #142006; border-color: var(--t-accent); font-size: 18px; }
.t-sub { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; max-width: 760px; width: 100%; margin: 8px auto 0; }
.t-sub .mini { background: transparent; color: var(--t-muted); border: 1.5px solid #2C4434; }
.t-link { background: none; border: 0; color: var(--t-accent); text-decoration: underline; cursor: pointer; padding: 0; font-family: var(--font-display); font-weight: 700; justify-self: start; min-height: 32px; }

/* Kaarten (printversie) */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; }
.sheet-bar {
  position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.sheet-bar .hint { color: var(--muted); font-size: 13.5px; flex-basis: 100%; }
.sheet-page { max-width: 900px; margin-inline: auto; padding: 20px 16px 60px; display: grid; gap: 18px; }
.sheet-page > header h1 { font-size: 30px; font-weight: 900; font-stretch: 108%; }
.sched { width: 100%; border-collapse: collapse; font-size: 15px; }
.sched td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.sched td:first-child { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; width: 64px; }
.pcards { display: grid; gap: 14px; }
@media (min-width: 720px) { .pcards { grid-template-columns: 1fr 1fr; } }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; break-inside: avoid; }
.pcard h2 { font-size: 20px; font-weight: 900; }
.pcard p, .pcard li { font-size: 14px; }
.pcard ol { margin: 0; padding-left: 18px; }
.pcard .story { font-size: 14.5px; padding: 8px 10px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

@media print {
  :root, :root[data-theme], :root:not([data-theme="light"]) {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F1F3EF; --fg: #111111; --muted: #444444; --line: #BBBBBB;
    --field: #E6F0E1; --field-mow: #DCE9D6; --chalk: #2F5D3B; --net: rgba(47, 93, 59, .12); --ink-on-field: #222222;
    color-scheme: light;
  }
  body > *:not(#sheet) { display: none !important; }
  #sheet { position: static; overflow: visible; display: block !important; }
  .sheet-bar { display: none; }
  .sheet-page { padding: 0; max-width: none; }
  .pcards { grid-template-columns: 1fr 1fr; }
  .pcard { box-shadow: none; }
}

  if (dir === 'l') post = `<path d="M${x0} ${y0}V${y0 + h}" class="sk-post"/>`;
  if (dir === 'r') post = `<path d="M${x0 + w} ${y0}V${y0 + h}" class="sk-post"/>`;
  if (dir === 't') post = `<path d="M${x0} ${y0}H${x0 + w}" class="sk-post"/>`;
  if (dir === 'b') post = `<path d="M${x0} ${y0 + h}H${x0 + w}" class="sk-post"/>`;

  let d = `M${p[0][0]} ${p[0][1]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
    d += `Q${p[i][0]} ${p[i][1]} ${mx} ${my}`;

  let s = `<svg viewBox="0 0 200 120" class="sk" role="img" aria-label="Schets: ${esc(g.naam)}"><rect x="0" y="0" width="200" height="120" rx="8" class="sk-field"/><rect x="0" y="0" width="200" height="120" rx="8" fill="url(#kv-mow)"/>`;
  for (const [it] of items) {
    const [t, ...a] = it;
    switch (t) {
      case 'z': s += `<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" rx="3" class="sk-zone"/>`;
        if (a[4]) s += `<text x="${a[0] + 4}" y="${a[1] + 9}" class="sk-txt l">${esc(a[4])}</text>`; break;
      case 'w': s += `<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" class="sk-water"/>`; break;
      case 'ln': s += `<path d="M${a[0]} ${a[1]}L${a[2]} ${a[3]}" class="sk-line"/>`; break;
      case 'c': s += cone(a[0], a[1], a[2]); break;
      case 'cl': for (let i = 0; i < a[4]; i++) s += cone(a[0] + (a[2] - a[0]) * i / (a[4] - 1), a[1] + (a[3] - a[1]) * i / (a[4] - 1)); break;
      case 'gt': s += cone(a[0], a[1] - 7) + cone(a[0], a[1] + 7); break;
      case 'g': s += goal(a[0], a[1], a[2], false); break;
      case 'G': s += goal(a[0], a[1], a[2], true); break;
      case 'k': s += `<circle cx="${a[0]}" cy="${a[1]}" r="4.6" class="sk-kid t${a[2] || 0}"/>`; break;
      case 'kb': s += `<circle cx="${a[0]}" cy="${a[1]}" r="4.6" class="sk-kid t${a[2] || 0}"/><circle cx="${a[0] + 5.6}" cy="${a[1] + 3.6}" r="2.6" class="sk-ball"/>`; break;
      case 'p': s += `<circle cx="${a[0]}" cy="${a[1]}" r="5.8" class="sk-parent"/>`; break;
      case 'b': s += `<circle cx="${a[0]}" cy="${a[1]}" r="2.6" class="sk-ball"/>`; break;
      case 'a': s += `<path d="${route(a)}" class="sk-run"/>`; break;
      case 's': s += `<path d="${route(a)}" class="sk-pass"/>`; break;
      case 't': s += `<text x="${a[0]}" y="${a[1]}" class="sk-txt">${esc(a[2])}</text>`; break;

function validSlots(slots) {
  return slots && SLOTS.every(s => byId[slots[s.key]] && byId[slots[s.key]].type === s.type);
}
function fillSlot(key, avoid) {
  const slot = SLOT[key];
  const used = Object.entries(state.slots).filter(([k]) => k !== key).map(([, v]) => v);
  const base = GAMES.filter(g => g.type === slot.type && !used.includes(g.id));
  let pool = base.filter(g => g.id !== avoid);
  if (slot.type === 'station') {
    const same = pool.filter(g => g.skill === slot.skill);
    if (same.length) pool = same;
  }
  if (!pool.length) pool = base;
  if (pool.length) state.slots[key] = pick(pool).id;
}
function shuffle() {

}
function persist() { store.set('current', { slots: state.slots, locks: state.locks, start: state.start }); }

(function init() {
  const cur = store.get('current', null);
  if (cur && validSlots(cur.slots)) {
    state.slots = { ...cur.slots };
    state.locks = cur.locks || {};
    if (/^\d{2}:\d{2}$/.test(cur.start || '')) state.start = cur.start;
  } else {

  state.tab = store.get('tab', 'training');

function schedule() {
  return [

    { kind: 'game', slot: 'warmup', min: 10, title: 'Warming-up' },
    { kind: 'round', round: 0, min: 6, title: 'Stations · ronde 1' },
    { kind: 'switch', round: 1, min: 1, title: 'Wisselen' },
    { kind: 'round', round: 1, min: 6, title: 'Stations · ronde 2' },
    { kind: 'break', round: 2, min: 3, title: 'Drinkpauze' },
    { kind: 'round', round: 2, min: 6, title: 'Stations · ronde 3' },
    { kind: 'switch', round: 3, min: 1, title: 'Wisselen' },
    { kind: 'round', round: 3, min: 6, title: 'Stations · ronde 4' },
    { kind: 'toGame', min: 1, title: 'Naar de partijtjes' },
    { kind: 'game', slot: 'partij', min: 12, title: 'Partijtjes' },
    { kind: 'game', slot: 'afsluiter', min: 3, title: 'Afsluiter' }
  ].reduce((acc, b) => { b.at = acc.length ? acc[acc.length - 1].at + acc[acc.length - 1].min : 0; acc.push(b); return acc; }, []);
}
const stationFor = (group, round) => STATIONS[(group + round) % 4];
function keyTimes() {

    intro: 0,
    warmup: at(b => b.slot === 'warmup'),
    stations: at(b => b.kind === 'round'),
    rounds: sc.filter(b => b.kind === 'round').map(b => b.at),
    partij: at(b => b.slot === 'partij'),

}
const game = key => byId[state.slots[key]];
const code = slots => SLOTS.map(s => (slots || state.slots)[s.key]).join('.');

function parseCode(text) {
  const m = String(text || '').toLowerCase().match(/[a-z0-9]+(?:\.[a-z0-9]+){6}/);
  if (!m) return { error: 'Geen code gevonden. Een code bestaat uit 7 spelnamen met punten ertussen.' };
  const ids = m[0].split('.');
  const slots = {};
  for (let i = 0; i < SLOTS.length; i++) {
    const g = byId[ids[i]];
    if (!g || g.type !== SLOTS[i].type) return { error: `"${ids[i]}" ken ik niet op deze plek. Controleer of de hele code is meegekopieerd.` };
    slots[SLOTS[i].key] = g.id;
  }
  if (new Set(STATIONS.map(k => slots[k])).size !== 4) return { error: 'In deze code staat een station dubbel.' };
  return { slots };
}

  try {
    await navigator.clipboard.writeText(text);
    toast('Gekopieerd. Plak het in de app-groep.');
  } catch (e) {
    openDialog(`<div class="dlg">
      <div class="dlg-head"><div><p class="eyebrow">Kopiëren lukte niet automatisch</p><h2>Selecteer en kopieer</h2></div><button class="icon-btn" data-action="close" aria-label="Sluiten">${I.x}</button></div>
      <textarea class="copy-area" id="copy-area" readonly>${esc(text)}</textarea>
    </div>`, 'Tekst kopiëren');
    const ta = $('#copy-area'); ta.focus(); ta.select();
  }
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------- Trainingskaarten ---------- */
function renderSheet() {
  const sc = schedule(), st = state.start;
  const rows = sc.map(b => {
    let what = b.title;
    if (b.kind === 'game') what += `: ${game(b.slot).naam}`;
    return `<tr><td>${clock(st, b.at)}</td><td>${esc(what)}</td></tr>`;
  }).join('');
  const card = key => {
    const g = game(key), s = SLOT[key];
    return `<article class="pcard">
      <p class="eyebrow">${esc(s.label)} · ${SKILLS[g.skill]} · ${g.duur} min</p>
      <h2>${esc(g.naam)}</h2>
      ${sketch(g)}
      <p><strong>Nodig:</strong> ${esc(g.materiaal.join(', '))}</p>
      <p><strong>Neerzetten:</strong> ${esc(g.opzet)}</p>
      <blockquote class="story">${esc(g.verhaal)}</blockquote>
      <ol>${g.verloop.map(v => `<li>${esc(v)}</li>`).join('')}</ol>
      <p><strong>Makkelijker:</strong> ${esc(g.makkelijker)} <strong>Moeilijker:</strong> ${esc(g.moeilijker)}</p>
    </article>`;
  };
  $('#sheet').innerHTML = `
    <div class="sheet-bar">
      <button class="btn" data-action="close-sheet">${I.x}Sluiten</button>
      ${framed ? '' : `<button class="btn primary" data-action="print">Printen</button>`}
      ${framed ? `<p class="hint">Printen kan niet vanuit deze link. Maak een schermafbeelding van een kaart en stuur die naar de ouder van dat station.</p>` : ''}
    </div>
    <div class="sheet-page">
      <header>
        <p class="eyebrow">Kabouterveld · start ${esc(st)}</p>
        <h1>Trainingskaarten</h1>
      </header>
      <table class="sched"><tbody>${rows}</tbody></table>
      ${rotationTable()}
      ${LEGEND}
      <div class="pcards">${SLOTS.map(s => card(s.key)).join('')}</div>
    </div>`;
}

/* ---------- Timer ---------- */
const T = { blocks: [], idx: 0, endAt: 0, remaining: 0, running: false, warned: false, iv: null, muted: store.get('muted', false), done: false };
let actx = null, wakeLock = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(at, dur, freq) {
  const o = actx.createOscillator(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  lfo.frequency.value = 30; lg.gain.value = 140;
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.32, at + 0.02);
  g.gain.setValueAtTime(0.32, at + dur - 0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(at); lfo.start(at); o.stop(at + dur + 0.02); lfo.stop(at + dur + 0.02);
}
function whistle(kind) {
  if (T.muted || !actx) return;
  try {
    const t = actx.currentTime + 0.03;
    if (kind === 'warn') tone(t, 0.16, 1900);
    else { tone(t, 0.18, 2700); tone(t + 0.28, 0.18, 2700); tone(t + 0.56, 0.7, 2700); }
  } catch (e) { /* geluid niet beschikbaar */ }
  if (kind !== 'warn') { try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch (e) { /* geen trillen */ } }
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('#timer').hidden) keepAwake(); });

function openTimer() {
  ensureAudio();
  T.blocks = schedule(); T.done = false;
  setBlock(0, true);
  $('#timer').hidden = false;
  document.documentElement.style.overflow = 'hidden';
  keepAwake();
  clearInterval(T.iv); T.iv = setInterval(tick, 250);
}
function closeTimer() {
  clearInterval(T.iv); T.iv = null; T.running = false;
  $('#timer').hidden = true;
  document.documentElement.style.overflow = '';
  try { wakeLock && wakeLock.release(); } catch (e) { /* al vrijgegeven */ }
  wakeLock = null;
}
function setBlock(i, run) {
  T.idx = Math.max(0, Math.min(i, T.blocks.length - 1));
  T.remaining = T.blocks[T.idx].min * 60000;
  T.warned = false; T.done = false;
  T.running = run;
  T.endAt = Date.now() + T.remaining;
  renderTimer();
}
function tick() {
  if (!T.running) return;
  T.remaining = T.endAt - Date.now();
  const b = T.blocks[T.idx];
  if (!T.warned && b.min >= 3 && T.remaining <= 30000) { T.warned = true; whistle('warn'); }
  if (T.remaining <= 0) {
    whistle('end');
    if (T.idx < T.blocks.length - 1) { setBlock(T.idx + 1, true); return; }
    T.running = false; T.remaining = 0; T.done = true; renderTimer(); return;
  }
  updateClock();
}
function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function updateClock() {
  const b = T.blocks[T.idx];
  const c = $('#t-clock'); if (!c) return;
  c.textContent = fmt(T.remaining);
  c.classList.toggle('warn', T.remaining <= 30000 && !T.done);
  c.classList.toggle('paused', !T.running && !T.done);
  const done = 1 - T.remaining / (b.min * 60000);
  $('#t-bar').style.width = Math.max(0, Math.min(100, done * 100)) + '%';
}
function groupList(round) {
  return `<ul class="t-groups">${[0, 1, 2, 3].map(g => {
    const k = stationFor(g, round);
    return `<li><b>Groep ${g + 1}</b><span class="letter">${SLOT[k].letter}</span><span>${esc(game(k).naam)}</span></li>`;
  }).join('')}</ul>`;
}
function renderTimer() {
  const b = T.blocks[T.idx], next = T.blocks[T.idx + 1], st = state.start;
  let kicker = b.title, title = '', body = '';
  if (T.done) {
    kicker = 'Klaar'; title = 'Training klaar!';
    body = '<p class="t-story">High five voor iedereen. Ballen en pionnen in de tas.</p>';
  } else if (b.kind === 'intro') {
    title = 'Vrij spelen';
    body = `<p class="t-story">Iedereen een bal, vrij spelen. Ouders zetten nu de stations klaar:</p><ul class="t-groups">${STATIONS.map(k => `<li><b>${SLOT[k].label}</b><span class="letter">${SLOT[k].letter}</span><span>${esc(game(k).naam)}</span></li>`).join('')}</ul>`;
  } else if (b.kind === 'game') {
    const g = game(b.slot);
    title = g.naam;
    body = `<p class="t-story">“${esc(g.verhaal)}”</p><button class="t-link" data-action="detail" data-id="${g.id}">Uitleg bekijken</button>`;
  } else if (b.kind === 'round') {
    title = 'Elk groepje bij zijn station';
    body = groupList(b.round);
  } else if (b.kind === 'switch') {
    title = 'Wisselen!';
    body = `<p class="t-story">Elk groepje schuift door naar het volgende station.</p>${groupList(b.round)}`;
  } else if (b.kind === 'break') {
    title = 'Drinken!';
    body = `<p class="t-story">Iedereen even drinken en plassen. Daarna verder bij het volgende station.</p>${groupList(b.round)}`;
  } else if (b.kind === 'toGame') {
    title = 'Naar de partijtjes';
    body = `<p class="t-story">Stations opruimen of laten staan, veldjes klaarzetten, hesjes uitdelen.</p>`;
  }
  const nextLine = T.done ? '' : next ? `Hierna om ${clock(st, next.at)}: ${esc(next.title)}${next.slot ? ' · ' + esc(game(next.slot).naam) : ''} (${next.min} min)` : `Einde om ${clock(st, b.at + b.min)}`;
  $('#timer').innerHTML = `
    <div class="t-top">
      <span class="t-step">${T.done ? 'Klaar' : `${clock(st, b.at)} · stap ${T.idx + 1} van ${T.blocks.length}`}</span>
      <button class="icon-btn" data-action="close-timer" aria-label="Timer sluiten">${I.x}</button>
    </div>
    <div class="t-main">
      <p class="t-kicker">${esc(kicker)}</p>
      <h2 class="t-title">${esc(title)}</h2>
      <div class="t-clock" id="t-clock" aria-live="off">0:00</div>
      <div class="t-bar"><i id="t-bar"></i></div>
      ${body}
      <p class="t-next">${nextLine}</p>
    </div>
    <div>
      <div class="t-controls">
        <button class="btn" data-action="t-prev" ${T.idx === 0 ? 'disabled' : ''}>${I.prev}Vorige</button>
        <button class="btn go" data-action="t-toggle">${T.running ? I.pause + 'Pauze' : I.play + (T.done ? 'Opnieuw' : 'Verder')}</button>
        <button class="btn" data-action="t-next" ${T.done ? 'disabled' : ''}>${I.next}${T.idx >= T.blocks.length - 1 ? 'Klaar' : 'Volgende'}</button>
      </div>
      <div class="t-sub">
        <button class="mini" data-action="t-plus">+1 minuut</button>
        <button class="mini" data-action="t-mute" aria-pressed="${T.muted}">${T.muted ? I.mute + 'Geluid uit' : I.sound + 'Geluid aan'}</button>
        <button class="mini" data-action="t-test">Test fluitje</button>
      </div>
    </div>`;
  updateClock();
}

/* ---------- Tabs & render ---------- */
function setTab(tab) {
  state.tab = tab; store.set('tab', tab);
  for (const t of ['training', 'spellen', 'bewaard']) {
    $('#tab-' + t).hidden = t !== tab;
    $('#tab-btn-' + t).setAttribute('aria-selected', String(t === tab));
  }
  render();
}
function render() {
  if (state.tab === 'training') renderTraining();
  if (state.tab === 'spellen') renderCatalog();
  if (state.tab === 'bewaard') renderSaved();
}

/* ---------- Acties ---------- */
const pendingDelete = {};
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { setTab(tabBtn.dataset.tab); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const { action, slot, id, saved } = b.dataset;
  switch (action) {
    case 'shuffle': shuffle(); persist(); render(); toast('Nieuwe training gehusseld'); break;
    case 'reroll': fillSlot(slot, state.slots[slot]); persist(); render(); break;
    case 'lock': state.locks[slot] = !state.locks[slot]; persist(); render(); break;
    case 'pick': openDialog(pickerHTML(slot), 'Kies een spel'); break;
    case 'choose': case 'place': {
      const prevId = state.slots[slot];
      const other = Object.keys(state.slots).find(k => k !== slot && state.slots[k] === id);
      if (other) state.slots[other] = prevId; // wissel twee stations om
      state.slots[slot] = id; state.locks[slot] = true;
      persist(); closeDialog();
      if (state.tab !== 'training') setTab('training'); else render();
      toast(`${byId[id].naam} staat bij ${SLOT[slot].label}`);
      break;
    }
    case 'detail': openDialog(detailHTML(byId[id]), byId[id].naam); break;
    case 'close': closeDialog(); break;
    case 'fav': {
      state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
      store.set('favs', [...state.favs]);
      if (dlg.open && $('#dlg-body .dlg-actions')) openDialog(detailHTML(byId[id]), byId[id].naam);
      if (state.tab === 'spellen') renderCatalog();
      break;
    }
    case 'filter': state.filter = b.dataset.filter; renderCatalog(); break;
    case 'copy': {
      const t = saved ? state.saved.find(x => x.id === saved) : null;
      copyText(t ? trainingText(t.slots, t.start) : trainingText());
      break;
    }
    case 'save': {
      const d = new Date().toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
      state.saved.unshift({ id: Date.now().toString(36), name: `${d} · ${game('warmup').naam}`, slots: { ...state.slots }, start: state.start });
      store.set('saved', state.saved);
      toast('Bewaard onder Bewaard');
      break;
    }
    case 'load': {
      const t = state.saved.find(x => x.id === saved);
      if (t && validSlots(t.slots)) {
        state.slots = { ...t.slots }; state.locks = Object.fromEntries(SLOTS.map(s => [s.key, true]));
        if (t.start) state.start = t.start;
        persist(); setTab('training'); toast('Training geopend. Alles staat vast.');
      }
      break;
    }
    case 'delete': {
      if (pendingDelete[saved]) {
        clearTimeout(pendingDelete[saved]); delete pendingDelete[saved];
        state.saved = state.saved.filter(x => x.id !== saved);
        store.set('saved', state.saved); renderSaved(); toast('Verwijderd');
      } else {
        b.innerHTML = `${I.x}Zeker weten?`;
        pendingDelete[saved] = setTimeout(() => { delete pendingDelete[saved]; if (state.tab === 'bewaard') renderSaved(); }, 3500);
      }
      break;
    }
    case 'sheet': renderSheet(); $('#sheet').hidden = false; $('#sheet').scrollTop = 0; break;
    case 'close-sheet': $('#sheet').hidden = true; break;
    case 'print': try { window.print(); } catch (err) { /* printen niet beschikbaar */ } break;
    case 'timer': openTimer(); break;
    case 'close-timer': closeTimer(); break;
    case 't-toggle':
      ensureAudio();
      if (T.done) { setBlock(0, true); break; }
      if (T.running) { T.running = false; T.remaining = T.endAt - Date.now(); }
      else { T.running = true; T.endAt = Date.now() + T.remaining; keepAwake(); }
      renderTimer(); break;
    case 't-next':
      if (T.idx >= T.blocks.length - 1) { T.running = false; T.remaining = 0; T.done = true; renderTimer(); }
      else setBlock(T.idx + 1, T.running);
      break;
    case 't-prev': setBlock(T.idx - 1, T.running); break;
    case 't-plus':
      if (T.running) T.endAt += 60000; else T.remaining += 60000;
      if (T.running) T.remaining = T.endAt - Date.now();
      T.blocks[T.idx].min += 1; T.warned = false; updateClock(); break;
    case 't-mute': T.muted = !T.muted; store.set('muted', T.muted); renderTimer(); break;
    case 't-test': ensureAudio(); { const m = T.muted; T.muted = false; whistle('end'); T.muted = m; } break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'start-time' && /^\d{2}:\d{2}$/.test(e.target.value)) {
    state.start = e.target.value; persist(); renderTraining();
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'code-form') return;
  e.preventDefault();
  const msg = $('#code-msg');
  const res = parseCode($('#code-input').value);
  if (res.error) { msg.className = 'form-msg'; msg.textContent = res.error; return; }
  const sm = $('#code-input').value.match(/start\s+(\d{1,2}:\d{2})/i);
  if (sm) state.start = sm[1].padStart(5, '0');
  state.slots = res.slots; state.locks = Object.fromEntries(SLOTS.map(s => [s.key, true]));
  persist(); setTab('training'); window.scrollTo(0, 0); toast('Training geladen. Alles staat vast.');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#timer').hidden && !dlg.open) closeTimer();
  else if (e.key === 'Escape' && !$('#sheet').hidden && !dlg.open) $('#sheet').hidden = true;
});

setTab(state.tab);
})();
</script>
